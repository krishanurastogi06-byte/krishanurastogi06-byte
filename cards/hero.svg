<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 280" width="1000" height="280" role="img"><style>text{font-family:'ProfileFont',Arial,sans-serif} .reveal{opacity:1;transform:translateY(0)} .grow{transform:scaleY(1)} .draw{stroke-dashoffset:0} .reveal{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) 0s both} .grow{transform:scaleY(0);transform-box:fill-box;transform-origin:bottom;animation:bar .75s ease-out 0.3s both} .draw{animation:line 1.5s ease-out 0.2s both} @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}} @keyframes bar{to{transform:scaleY(1)}} @keyframes line{to{stroke-dashoffset:0}} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important} .reveal{opacity:1!important;transform:none!important} .grow{transform:none!important} .draw{stroke-dashoffset:0!important}}</style><rect width="1000" height="280" rx="22" fill="#101414"/><rect x="1" y="1" width="998" height="278" rx="21" fill="none" stroke="#344339"/><text x="38" y="52" fill="#b5f36b" font-size="13" font-weight="700" letter-spacing="2.5">HELLO, WORLD</text><g class="reveal"><text x="38" y="132" fill="#f2f4ef" font-size="66" font-weight="800" >Krishanu Rastogi</text><text x="40" y="184" fill="#a4b4a9" font-size="23" font-weight="400" >Designing thoughtful interfaces. Building useful software.</text><text x="40" y="239" fill="#b5f36b" font-size="15" font-weight="600" >UI/UX Developer · React · Next.js · Product Design</text></g><circle cx="902" cy="125" r="62" fill="#1b2521" stroke="#b5f36b" stroke-width="2"/><text x="875" y="139" fill="#b5f36b" font-size="27" font-weight="700" >&lt;/&gt;</text></svg>