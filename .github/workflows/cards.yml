name: Refresh profile cards
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font subsetting
        run: pip install fonttools brotli
      - name: Fetch daily contributions and repository metadata
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_USER: krishanurastogi06-byte
        run: python fetch.py
      - name: Render animated cards
        run: python render.py
      - name: Commit refreshed cards and data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cards/ data/contributions.json README.md
          git diff --cached --quiet || (git commit -m 'chore: refresh profile cards' && git push)
