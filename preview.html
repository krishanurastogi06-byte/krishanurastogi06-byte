<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krishanu Rastogi — GitHub Profile README Preview</title>
  <style>
    :root {
      --color-canvas-default: #0d1117;
      --color-canvas-subtle: #161b22;
      --color-border-default: #30363d;
      --color-fg-default: #c9d1d9;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--color-canvas-default);
      color: var(--color-fg-default);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .github-container {
      width: 100%;
      max-width: 896px;
      background: var(--color-canvas-subtle);
      border: 1px solid var(--color-border-default);
      border-radius: 6px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .readme-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #8b949e;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--color-border-default);
    }
    .markdown-body {
      text-align: center;
    }
    .markdown-body img {
      max-width: 100%;
      box-sizing: border-box;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .nav-tiles-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.2%;
      margin: 16px 0;
      width: 100%;
    }
    .nav-tiles-row a {
      flex: 1;
      display: block;
      text-decoration: none;
    }
    .nav-tiles-row img {
      width: 100%;
      height: auto;
    }
    .section-gap {
      margin-bottom: 16px;
    }
    .badge-preview {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      background: #238636;
      color: white;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="badge-preview">Live Profile README Preview — Concept C (Architect's Kinetic Studio)</div>
  <div class="github-container">
    <div class="readme-header">
      <svg height="16" viewBox="0 0 16 16" width="16" fill="currentColor">
        <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h6.5a.25.25 0 0 1 .25.25v1.5a.25.25 0 0 1-.25.25h-6.5a.25.25 0 0 1-.25-.25Z"></path>
      </svg>
      <span>krishanurastogi06-byte / README.md</span>
    </div>

    <div class="markdown-body">
      <!-- Section 1: Hero Header Card -->
      <div class="section-gap">
        <img src="cards/hero.svg" alt="Krishanu Rastogi — UI/UX &amp; Frontend Developer" width="100%" />
      </div>

      <!-- Section 2: Three Horizontal Navigation Tiles -->
      <div class="nav-tiles-row">
        <a href="https://github.com/krishanurastogi06-byte">
          <img src="cards/link-1.svg" alt="01 GitHub" />
        </a>
        <a href="https://krishanu-rastogi-portfolio.vercel.app/">
          <img src="cards/link-2.svg" alt="02 Portfolio" />
        </a>
        <a href="https://github.com/krishanurastogi06-byte?tab=repositories">
          <img src="cards/link-3.svg" alt="03 Projects" />
        </a>
      </div>

      <!-- Section 3: Activity & Contribution Pulse -->
      <div class="section-gap">
        <img src="cards/activity.svg" alt="Engineering Activity and Telemetry Pulse" width="100%" />
      </div>

      <!-- Section 4: Featured Engineering Projects -->
      <div class="section-gap">
        <a href="https://github.com/krishanurastogi06-byte/TrustTrack" style="display:block; margin-bottom: 16px;">
          <img src="cards/repo-1.svg" alt="TrustTrack" width="100%" />
        </a>
        <a href="https://github.com/krishanurastogi06-byte/Aroven-Tech" style="display:block;">
          <img src="cards/repo-2.svg" alt="Aroven-Tech" width="100%" />
        </a>
      </div>

      <!-- Section 5: 365-Day Contribution Heatmap -->
      <div class="section-gap">
        <img src="cards/graph.svg" alt="365-Day Contribution Heatmap" width="100%" />
      </div>

      <!-- Section 6: Closing Identity Signature -->
      <div>
        <a href="https://krishanu-rastogi-portfolio.vercel.app/">
          <img src="cards/closing.svg" alt="Designing thoughtful interfaces. Building useful software." width="100%" />
        </a>
      </div>
    </div>
  </div>
</body>
</html>
