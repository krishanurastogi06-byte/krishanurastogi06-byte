<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 116" width="320" height="116" role="img"><style>text{font-family:'ProfileFont',Arial,sans-serif} .reveal{opacity:1;transform:translateY(0)} .grow{transform:scaleY(1)} .draw{stroke-dashoffset:0} .reveal{opacity:0;animation:rise .8s cubic-bezier(.2,.8,.2,1) 0.53s both} .grow{transform:scaleY(0);transform-box:fill-box;transform-origin:bottom;animation:bar .75s ease-out 0.8300000000000001s both} .draw{animation:line 1.5s ease-out 0.73s both} @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}} @keyframes bar{to{transform:scaleY(1)}} @keyframes line{to{stroke-dashoffset:0}} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important} .reveal{opacity:1!important;transform:none!important} .grow{transform:none!important} .draw{stroke-dashoffset:0!important}}</style><rect width="320" height="116" rx="22" fill="#101414"/><rect x="1" y="1" width="318" height="114" rx="21" fill="none" stroke="#344339"/><g class="reveal"><text x="25" y="48" fill="#b5f36b" font-size="16" font-weight="700" >02 / PORTFOLIO</text><text x="25" y="90" fill="#a4b4a9" font-size="14" font-weight="500" >Website URL needed</text><text x="280" y="48" fill="#b5f36b" font-size="26" font-weight="700" >↗</text></g></svg>